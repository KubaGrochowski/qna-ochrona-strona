name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # strona/index.html to fragment (bez <head>), bo tak wymaga podgląd w artefakcie.
      # Tu dokładamy pełny dokument HTML, żeby strona działała jako zwykła witryna.
      - name: Zbuduj stronę
        run: |
          mkdir -p _site
          cp -r strona/img _site/img
          {
            echo '<!doctype html>'
            echo '<html lang="pl"><head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<meta name="robots" content="noindex, nofollow">'
            echo '<link rel="icon" type="image/png" href="img/favicon.png">'
            echo '</head><body>'
            cat strona/index.html
            echo '</body></html>'
          } > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
